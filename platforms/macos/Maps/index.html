<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; worker-src blob:; img-src data: blob:; connect-src 'none'">
<title>Biblical Map</title>
<link rel="stylesheet" href="maplibre-gl.css">
<link rel="stylesheet" href="map.css">
<header>
  <label>Open local map archive <input id="archive" type="file" accept=".pmtiles"></label>
  <button id="install-pack" hidden>Install regional pack…</button>
  <button id="download-pack" hidden>Download pack from URL…</button>
  <button id="remove-pack" hidden>Remove installed pack</button>
  <output id="status" aria-live="polite">Showing bundled place markers.</output>
</header>
<div id="map" aria-label="Biblical map"></div>
<script src="maplibre-gl.js"></script>
<script src="pmtiles.js"></script>
<script src="map.js"></script>
</html>

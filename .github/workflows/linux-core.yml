name: linux-core
"on":
  # Routine checks run locally; hosted builds require an authorized manual run.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        mode: [release, sanitized]
    steps:
      - uses: actions/checkout@v7
      - name: Build patched SWORD for sanitizer tests
        if: matrix.mode == 'sanitized'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion libclucene-dev libicu-dev libbz2-dev liblzma-dev libcurl4-openssl-dev zlib1g-dev
          svn export --quiet --ignore-externals https://crosswire.org/svn/sword/tags/sword-1-9-0 "$RUNNER_TEMP/sword-src"
          dependencies/sword/apply-reviewed-patches.sh "$RUNNER_TEMP/sword-src"
          cmake -S "$RUNNER_TEMP/sword-src" -B "$RUNNER_TEMP/sword-build" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_BUILD_TYPE=Release -DLIBSWORD_LIBRARY_TYPE=Shared \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sword-sdk"
          cmake --build "$RUNNER_TEMP/sword-build" --parallel 2
          cmake --install "$RUNNER_TEMP/sword-build"
          pc=$(find "$RUNNER_TEMP/sword-sdk" -name sword.pc -print -quit)
          test -n "$pc"
          echo "PKG_CONFIG_PATH=$(dirname "$pc")" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$(dirname "$pc")")" >> "$GITHUB_ENV"
      - name: Build and test core
        shell: bash
        run: |
          args=(--install-deps --jobs 2)
          if [[ '${{ matrix.mode }}' == sanitized ]]; then args+=(--sanitize); fi
          platforms/linux/core.sh "${args[@]}"
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-core-${{ matrix.os }}-${{ matrix.mode }}-logs
          path: build/linux-core-*/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
  distro-preview:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:13
            runner: ubuntu-24.04
            name: Debian 13 x86-64
          - image: fedora:45
            runner: ubuntu-24.04-arm
            name: Fedora 45 ARM64
    name: GTK preview (${{ matrix.name }})
    container: ${{ matrix.image }}
    steps:
      - name: Install checkout and desktop dependencies
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y git ca-certificates file dpkg-dev libgtk-4-dev libwebkitgtk-6.0-dev
          else
            dnf install -y git ca-certificates gtk4-devel 'pkgconfig(webkitgtk-6.0)' rpm-build
          fi
      - uses: actions/checkout@v7
      - name: Build and test core
        run: platforms/linux/core.sh --install-deps --jobs 2
      - name: Build GTK preview and stage installation
        shell: bash
        run: |
          cmake -S platforms/linux -B build/gtk4 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/gtk4 --target xiphos-linux-preview --parallel 2
          cmake --install build/gtk4 --prefix "$RUNNER_TEMP/xiphos-preview"
          test -x "$RUNNER_TEMP/xiphos-preview/bin/xiphos-linux-preview"
          if command -v rpmbuild >/dev/null; then
            cpack --config build/gtk4/CPackConfig.cmake -G RPM -B build/gtk4/packages
          else
            cpack --config build/gtk4/CPackConfig.cmake -G DEB -B build/gtk4/packages
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: xiphos-5.0-beta.1-${{ matrix.runner }}
          path: |
            build/gtk4/packages/*.rpm
            build/gtk4/packages/*.deb
          if-no-files-found: error

name: native-core
on: workflow_dispatch
permissions:
  contents: read
jobs:
  macos-reader:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: brew install glib pkg-config libarchive libpng jpeg-turbo subversion icu4c
      - name: Build patched SWORD
        run: |
          svn export --force --quiet --ignore-externals https://crosswire.org/svn/sword/tags/sword-1-9-0 "$RUNNER_TEMP/sword-src"
          dependencies/sword/apply-reviewed-patches.sh "$RUNNER_TEMP/sword-src"
          cmake -S "$RUNNER_TEMP/sword-src" -B "$RUNNER_TEMP/sword-build" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=27.0 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix icu4c)" \
            -DSWORD_NO_CLUCENE=Yes -DSWORD_NO_CURL=Yes \
            -DLIBSWORD_LIBRARY_TYPE=Shared -DCMAKE_INSTALL_NAME_DIR="$RUNNER_TEMP/sword-sdk/lib" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sword-sdk"
          cmake --build "$RUNNER_TEMP/sword-build" --parallel 3
          cmake --install "$RUNNER_TEMP/sword-build"
          pc=$(find "$RUNNER_TEMP/sword-sdk" -name sword.pc -print -quit)
          test -n "$pc"
          echo "PKG_CONFIG_PATH=$(dirname "$pc")" >> "$GITHUB_ENV"
      - name: Build native preview
        run: |
          sw_vers
          xcodebuild -version
          cmake -S platforms/macos -B build/macos -DCMAKE_BUILD_TYPE=Release -DXIPHOS_SWORD_SAFE_BOOK_DELETE=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix libarchive);$(brew --prefix jpeg-turbo)"
          cmake --build build/macos --parallel 3
      - name: Test native preview
        run: ctest --test-dir build/macos --output-on-failure --parallel 2
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-test-logs
          path: build/macos/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

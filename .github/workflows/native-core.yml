name: native-core
on: workflow_dispatch
permissions:
  contents: read
jobs:
  macos-reader:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: brew install sword glib pkg-config libarchive libpng jpeg-turbo
      - name: Build native preview
        run: |
          sw_vers
          xcodebuild -version
          cmake -S platforms/macos -B build/macos -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix libarchive);$(brew --prefix jpeg-turbo)"
          cmake --build build/macos --parallel 3
      - name: Test native preview
        run: ctest --test-dir build/macos --output-on-failure --parallel 2
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-test-logs
          path: build/macos/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
